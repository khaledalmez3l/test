<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turnip Hollow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky farm ledger (HUD) over a tabbed workspace; the field grid is the hero of the first tab. */
:root{
  --bg:#e5ebd3; --bg2:#d8e1c1; --panel:#f7f9ef; --panel2:#eef2e1; --line:#c8d2ae;
  --ink:#24301f; --mute:#5d6a52;
  --soil:#8a5a35; --soil2:#6a4327; --furrow:rgba(60,34,16,.28);
  --leaf:#3e7c31; --onleaf:#ffffff; --leafsoft:#dcebcf;
  --gold:#c9850f; --goldsoft:#f5e2b6; --goldglow:rgba(240,180,40,.75);
  --sky:#2f7395; --bad:#b0412b; --good:#2e7a39;
  --shadow:0 1px 0 rgba(36,48,31,.07),0 6px 16px -10px rgba(36,48,31,.45);
  --fd:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --fb:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111912; --bg2:#172119; --panel:#1b271e; --panel2:#213025; --line:#2e4033;
    --ink:#e3ebd6; --mute:#98a88c;
    --soil:#5c3b24; --soil2:#432a19; --furrow:rgba(0,0,0,.35);
    --leaf:#7cc46a; --onleaf:#0f1a0e; --leafsoft:#22392a;
    --gold:#f0b347; --goldsoft:#3b3020; --goldglow:rgba(255,200,80,.6);
    --sky:#7cb9d8; --bad:#e67b63; --good:#7cc46a;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111912; --bg2:#172119; --panel:#1b271e; --panel2:#213025; --line:#2e4033;
  --ink:#e3ebd6; --mute:#98a88c;
  --soil:#5c3b24; --soil2:#432a19; --furrow:rgba(0,0,0,.35);
  --leaf:#7cc46a; --onleaf:#0f1a0e; --leafsoft:#22392a;
  --gold:#f0b347; --goldsoft:#3b3020; --goldglow:rgba(255,200,80,.6);
  --sky:#7cb9d8; --bad:#e67b63; --good:#7cc46a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:22px}
h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--mute)}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:21px;margin-right:auto}
.brand .mark{font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12));border:0;background:none;padding:0;cursor:pointer;line-height:1}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.iconpick button{aspect-ratio:1;max-width:100%;font-size:28px;border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;cursor:pointer;display:grid;place-items:center}
.iconpick button:hover{border-color:var(--leaf)}
.iconpick button.on{border-color:var(--leaf);background:var(--leafsoft);box-shadow:inset 0 0 0 1px var(--leaf)}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.stat b{font-family:var(--fd);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{height:6px;width:120px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--leaf);border-radius:9px;transition:width .25s}
.gseed{display:inline-block;width:.8em;height:.95em;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff6c9,#f2c14b 40%,#b77a0e);vertical-align:-.1em;box-shadow:0 0 6px var(--goldglow)}
.worldbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.boost{background:var(--goldsoft);border-color:var(--gold)}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;border-bottom:2px solid var(--line)}
.tab{position:relative;border:0;background:none;padding:8px 12px 9px;font-family:var(--fd);font-weight:600;font-size:15px;color:var(--mute);cursor:pointer;border-radius:10px 10px 0 0;margin-bottom:-2px;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink);background:var(--panel2)}
.tab.on{color:var(--ink);border-bottom-color:var(--leaf);background:var(--panel)}
.tab[disabled]{opacity:.45;cursor:not-allowed}
.tab .badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1d1404;font-size:11px;font-family:var(--fb);font-weight:800;display:grid;place-items:center}

#panel{margin-top:18px}
.section{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lead{max-width:68ch;color:var(--mute);margin:0}

.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover:not([disabled]){background:var(--leafsoft)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.pri{background:var(--leaf);color:var(--onleaf);border-color:transparent}
.btn.pri:hover:not([disabled]){filter:brightness(1.07);background:var(--leaf)}
.btn.gold{background:var(--gold);color:#1d1404;border-color:transparent}
.btn.warn{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.on{background:var(--leafsoft);border-color:var(--leaf);color:var(--leaf)}

/* Seeds */
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.seed{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;min-width:0}
.seed:hover:not([disabled]){border-color:var(--leaf)}
.seed.on{border-color:var(--leaf);background:var(--leafsoft);box-shadow:inset 0 0 0 1px var(--leaf)}
.seed .e{font-size:26px;grid-row:span 2}
.seed .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seed .meta{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.seed .ins{color:var(--good);font-weight:800}
.seed[disabled]{opacity:.5;cursor:not-allowed}

/* Plots */
.field{background:linear-gradient(var(--bg2),var(--bg2));border-radius:18px;padding:12px;border:1px solid var(--line)}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.plot{position:relative;aspect-ratio:1;max-width:100%;border:0;border-radius:14px;cursor:pointer;overflow:hidden;padding:0;
  background:repeating-linear-gradient(180deg,transparent 0 11px,var(--furrow) 11px 14px),linear-gradient(160deg,var(--soil),var(--soil2));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.1);display:grid;place-items:center;transition:transform .1s}
.plot:hover{transform:translateY(-2px)}
.plot:active{transform:translateY(1px) scale(.98)}
.plot .sp{font-size:40px;line-height:1;transform:scale(var(--s,1));transition:transform .3s;filter:drop-shadow(0 3px 1px rgba(0,0,0,.25))}
.plot .empty{font-family:var(--fd);font-size:28px;color:rgba(255,240,220,.45)}
.plot .bar{position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden}
.plot .bar i{display:block;height:100%;background:#9be27d;border-radius:5px}
.plot .tl{position:absolute;top:5px;right:7px;font-size:10.5px;font-weight:800;color:rgba(255,245,230,.85);font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.plot.ready .sp{animation:bob 1.4s ease-in-out infinite}
.plot.ready{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 3px #9be27d}
.plot.golden .sp{filter:drop-shadow(0 0 8px var(--goldglow)) drop-shadow(0 0 2px #fff3b0) saturate(1.3)}
.plot.golden.ready{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 3px #f2c14b,0 0 18px var(--goldglow)}
.plot.golden::after{content:"★";position:absolute;top:4px;left:7px;color:#ffd75e;font-size:13px;text-shadow:0 0 6px #ffcb3d}
@keyframes bob{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.06) translateY(-3px)}}

/* Lists */
.bar2{height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--leaf);border-radius:8px}
.bar2.gold i{background:var(--gold)}
.big{font-size:38px;line-height:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv span:last-child{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.ing{display:flex;flex-wrap:wrap;gap:4px}
.ing span{font-size:12px;font-weight:800;padding:1px 7px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.ing span.miss{color:var(--bad);border-color:var(--bad)}
.ing span.ok{color:var(--good)}
.warn-t{color:var(--bad);font-weight:800;font-size:12px}
.lock{opacity:.55}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:7px;background:var(--goldsoft);color:var(--gold);border:1px solid var(--gold)}
.tag.green{background:var(--leafsoft);color:var(--leaf);border-color:var(--leaf)}

.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800;background:var(--panel2)}
tr:last-child td{border-bottom:0}
tr.hot td{background:var(--goldsoft)}
.up{color:var(--good);font-weight:800}.down{color:var(--bad);font-weight:800}

.order{display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center}
.who .face{font-size:30px;width:46px;height:46px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line)}
.want{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2)}
.want .e{font-size:28px}

.skill .pips{display:flex;gap:3px;flex-wrap:wrap}
.skill .pips i{width:10px;height:10px;border-radius:3px;background:var(--bg2);border:1px solid var(--line)}
.skill .pips i.f{background:var(--leaf);border-color:var(--leaf)}

.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px dashed var(--line)}
.ach.got{border-style:solid;background:var(--goldsoft);border-color:var(--gold)}
.ach .medal{font-size:22px;width:34px;text-align:center;filter:grayscale(1);opacity:.5}
.ach.got .medal{filter:none;opacity:1}

.festival-hero{background:radial-gradient(120% 140% at 0% 0%,var(--goldsoft),var(--panel) 60%);border-color:var(--gold)}
.bignum{font-family:var(--fd);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

/* Floating bits */
#toasts{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30;max-width:min(340px,calc(100vw - 28px));pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--leaf);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-weight:700;font-size:13px;animation:tin .25s ease-out}
.toast.gold{border-left-color:var(--gold)} .toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.float{position:fixed;pointer-events:none;z-index:40;font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ink);text-shadow:0 1px 0 var(--panel),0 0 6px var(--panel);animation:fl 1s ease-out forwards;white-space:nowrap}
.float.g{color:var(--gold)}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
#bee{position:fixed;z-index:35;border:0;background:none;font-size:38px;cursor:pointer;padding:6px;filter:drop-shadow(0 0 10px var(--goldglow)) sepia(.4) saturate(2.2);animation:buzz 2.4s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(14px,-10px) rotate(6deg)}50%{transform:translate(-6px,-18px) rotate(-4deg)}75%{transform:translate(-14px,-4px) rotate(8deg)}}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,10,.55);display:grid;place-items:center;padding:20px}
#modal .card{max-width:420px;width:100%}
/* 3D farm */
#world{position:relative;margin-top:16px;height:clamp(360px,64vh,660px);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#9fd3ea;box-shadow:var(--shadow)}
#world .stage,#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.w-hint{position:absolute;left:12px;top:10px;right:12px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
.w-hint .t-only{display:none}
.w-prompt{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,28,18,.8);color:#fff;padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.w-prompt:empty{display:none}
.joy{position:absolute;left:16px;bottom:16px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);touch-action:none;display:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.8);pointer-events:none}
.w-act{position:absolute;right:16px;bottom:24px;width:86px;height:86px;border-radius:50%;border:0;background:var(--gold);color:#1d1404;font-family:var(--fd);font-weight:700;font-size:19px;display:none;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
@media (pointer:coarse){.joy,.w-act{display:block}.w-prompt{bottom:146px}.w-hint .k-only{display:none}.w-hint .t-only{display:inline}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:560px){
  .brand{width:100%}
  .xpbar{width:90px}
  .plots{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
  .plot .sp{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap">
  <header id="hud"></header>
  <section id="world" hidden aria-label="3D farm">
    <div class="stage"></div>
    <div class="w-hint"><span class="k-only">WASD or arrow keys: walk · Q / E or drag: turn camera · Space: plant, water, harvest · Click a plot to walk there</span><span class="t-only">Joystick: walk · Drag: turn camera · Act: plant, water, harvest · Tap a plot to walk there</span></div>
    <div class="w-prompt"></div>
    <div class="joy"><i></i></div>
    <button class="w-act" type="button">Act</button>
  </section>
  <main id="panel"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<button id="bee" hidden aria-label="Catch the golden bee">🐝</button>
<div id="modal" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ---------- 3D farm (third-person) ---------- */
const World=(function(){
  let inited=false,shown=false,R,scene,cam,sun,hemi,groundMat,ring,farmer,hand,weatherPts,ray;
  let plots=[],animals=[],animalSig='',pickables=[];
  let yaw=0,heading=0,target=null,swing=0,lastAct=0,lastT=0,promptTxt='',handIdle=null;
  let el,stage,promptEl,ground;
  const keys={},joy={x:0,y:0};
  const texCache={};
  const GAP=2.5;
  const pos={x:0,z:4},hp={x:-4,z:3};
  const coarse=()=>matchMedia('(pointer:coarse)').matches;
  const plotXZ=i=>[(i%6-2.5)*GAP,-2-Math.floor(i/6)*GAP];

  function emojiTex(e){
    if(texCache[e])return texCache[e];
    const c=document.createElement('canvas');c.width=c.height=128;
    const x=c.getContext('2d');
    x.font='100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,74);
    return texCache[e]=new THREE.CanvasTexture(c);
  }
  const mat=c=>new THREE.MeshLambertMaterial({color:c});
  function mesh(geo,c){const m=new THREE.Mesh(geo,typeof c==='number'?mat(c):c);m.castShadow=true;m.receiveShadow=true;return m}
  const box=(w,h,d,c)=>mesh(new THREE.BoxGeometry(w,h,d),c);

  function makePerson(shirt,pants,hatC){
    const g=new THREE.Group();
    const hipL=new THREE.Group(),hipR=new THREE.Group(),shL=new THREE.Group(),shR=new THREE.Group();
    hipL.position.set(-.15,.62,0);hipR.position.set(.15,.62,0);
    shL.position.set(-.41,1.28,0);shR.position.set(.41,1.28,0);
    const lL=box(.22,.62,.26,pants);lL.position.y=-.31;hipL.add(lL);
    const lR=box(.22,.62,.26,pants);lR.position.y=-.31;hipR.add(lR);
    const aL=box(.17,.58,.2,shirt);aL.position.y=-.27;shL.add(aL);
    const aR=box(.17,.58,.2,shirt);aR.position.y=-.27;shR.add(aR);
    const body=box(.62,.72,.38,shirt);body.position.y=.98;
    const bib=box(.44,.42,.05,pants);bib.position.set(0,.9,.2);
    const head=mesh(new THREE.SphereGeometry(.26,16,12),0xf0c38e);head.position.y=1.6;
    const eL=box(.05,.07,.02,0x2a2118);eL.position.set(-.09,1.64,.245);
    const eR=box(.05,.07,.02,0x2a2118);eR.position.set(.09,1.64,.245);
    const brim=mesh(new THREE.CylinderGeometry(.5,.5,.04,20),hatC);brim.position.y=1.79;
    const crown=mesh(new THREE.CylinderGeometry(.22,.27,.27,16),hatC);crown.position.y=1.93;
    g.add(hipL,hipR,shL,shR,body,bib,head,eL,eR,brim,crown);
    return {g,hipL,hipR,shL,shR,ph:0};
  }
  function animPerson(p,moving,dt,sw){
    if(moving)p.ph+=dt*11;
    const a=moving?Math.sin(p.ph)*.65:0;
    p.hipL.rotation.x=a;p.hipR.rotation.x=-a;
    p.shL.rotation.x=-a*.8;p.shR.rotation.x=a*.8-sw*3;
  }
  function turnTo(cur,want,k){
    let d=want-cur;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    return cur+d*k;
  }
  function stepToward(p,obj,tx,tz,speed,dt){
    const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
    if(d<.08)return true;
    const s=Math.min(d,speed*dt);
    p.x+=dx/d*s;p.z+=dz/d*s;
    obj.rotation.y=turnTo(obj.rotation.y,Math.atan2(dx,dz),1-Math.exp(-dt*12));
    return false;
  }

  function buildScenery(){
    let seed=42;const r=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
    for(let k=0;k<52;k++){
      const ang=r()*Math.PI*2,rad=27+r()*18;
      const t=new THREE.Group();
      const trunk=mesh(new THREE.CylinderGeometry(.22,.3,1.6,8),0x7a5434);trunk.position.y=.8;
      const top=r()<.5?mesh(new THREE.ConeGeometry(1.4,3,9),0x2f6b34):mesh(new THREE.SphereGeometry(1.45,12,10),0x4b8d3a);
      top.position.y=top.geometry.type==='ConeGeometry'?2.9:2.6;
      t.add(trunk,top);
      const sc=.8+r()*.6;t.scale.set(sc,sc,sc);
      t.position.set(Math.cos(ang)*rad,0,Math.sin(ang)*rad-4);
      scene.add(t);
    }
    // barn
    const barn=new THREE.Group();
    const bb=box(6,3.4,4.6,0xb23a2e);bb.position.y=1.7;
    const r1=box(3.7,.22,5,0x5b2a24);r1.position.set(-1.45,3.95,0);r1.rotation.z=.62;
    const r2=box(3.7,.22,5,0x5b2a24);r2.position.set(1.45,3.95,0);r2.rotation.z=-.62;
    const gable=mesh(new THREE.CylinderGeometry(2.4,2.4,4.5,3,1),0xb23a2e);gable.rotation.set(Math.PI/2,0,Math.PI/2);gable.scale.set(1,1,.42);gable.position.y=3.55;
    const door=box(2,2.3,.08,0xf3eee4);door.position.set(0,1.15,2.32);
    const doorIn=box(1.7,2,.1,0x7a2a20);doorIn.position.set(0,1.05,2.33);
    barn.add(bb,r1,r2,gable,door,doorIn);
    barn.position.set(-13,0,-6);scene.add(barn);
    // farmhouse / kitchen
    const house=new THREE.Group();
    const hb=box(5,3,4,0xf1e2c4);hb.position.y=1.5;
    const h1=box(3.2,.22,4.4,0x6b4a3a);h1.position.set(-1.25,3.55,0);h1.rotation.z=.6;
    const h2=box(3.2,.22,4.4,0x6b4a3a);h2.position.set(1.25,3.55,0);h2.rotation.z=-.6;
    const hg=mesh(new THREE.CylinderGeometry(2.1,2.1,4,3,1),0xf1e2c4);hg.rotation.set(Math.PI/2,0,Math.PI/2);hg.scale.set(1,1,.4);hg.position.y=3.1;
    const hd=box(1,1.8,.08,0x7a5434);hd.position.set(0,.9,2.02);
    const w1=box(.9,.8,.08,0x9fd0e8);w1.position.set(-1.5,1.8,2.02);
    const w2=box(.9,.8,.08,0x9fd0e8);w2.position.set(1.5,1.8,2.02);
    const ch=box(.6,1.4,.6,0x8c5a44);ch.position.set(1.4,4.2,-.8);
    house.add(hb,h1,h2,hg,hd,w1,w2,ch);
    house.position.set(13,0,-5);scene.add(house);
    // animal pen fence
    const post=new THREE.BoxGeometry(.15,.9,.15),pm=mat(0xc9a46a);
    for(let x=-17;x<=-9;x+=1){for(const z of [0,5]){const p=mesh(post,pm);p.position.set(x,.45,z);scene.add(p)}}
    for(let z=1;z<5;z+=1){for(const x of [-17,-9]){const p=mesh(post,pm);p.position.set(x,.45,z);scene.add(p)}}
    for(const [w,d,x,z] of [[8,.08,-13,0],[8,.08,-13,5],[.08,5,-17,2.5],[.08,5,-9,2.5]]){
      for(const y of [.35,.7]){const rl=box(w,.08,d,0xc9a46a);rl.position.set(x,y,z);scene.add(rl)}
    }
    // path and pond
    const path=new THREE.Mesh(new THREE.PlaneGeometry(2.2,14),mat(0xd9c48f));path.rotation.x=-Math.PI/2;path.position.set(0,.01,7);path.receiveShadow=true;scene.add(path);
    const pond=new THREE.Mesh(new THREE.CircleGeometry(2.8,32),new THREE.MeshLambertMaterial({color:0x4a9ccc}));pond.rotation.x=-Math.PI/2;pond.position.set(9,.02,7);scene.add(pond);
    // field bed
    const bed=new THREE.Mesh(new THREE.PlaneGeometry(16,17),mat(0x6e8f3c));bed.rotation.x=-Math.PI/2;bed.position.set(0,.005,-8.2);bed.receiveShadow=true;scene.add(bed);
  }

  const plotGeo=()=>new THREE.BoxGeometry(2,.25,2);
  let shared=null;
  function makePlot(i){
    if(!shared)shared={geo:plotGeo(),soil:mat(0x7a4b2a),ready:new THREE.MeshLambertMaterial({color:0x7a4b2a,emissive:0x2f5a12}),fgeo:new THREE.BoxGeometry(1.9,.05,.16),fmat:mat(0x5a3519)};
    const g=new THREE.Group();
    const soil=new THREE.Mesh(shared.geo,shared.soil);soil.position.y=.125;soil.receiveShadow=true;soil.castShadow=true;soil.userData.plot=i;
    g.add(soil);
    for(const k of [-.6,0,.6]){const f=new THREE.Mesh(shared.fgeo,shared.fmat);f.position.set(0,.26,k);g.add(f)}
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex('🌱'),alphaTest:.2}));sp.visible=false;g.add(sp);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex('✨'),alphaTest:.2}));glow.scale.set(.6,.6,.6);glow.visible=false;g.add(glow);
    const bc=document.createElement('canvas');bc.width=64;bc.height=12;
    const bt=new THREE.CanvasTexture(bc);
    const bar=new THREE.Sprite(new THREE.SpriteMaterial({map:bt,transparent:true,depthTest:false}));bar.scale.set(1.3,.24,1);bar.position.y=2.1;bar.visible=false;bar.renderOrder=5;g.add(bar);
    const [x,z]=plotXZ(i);g.position.set(x,0,z);
    scene.add(g);
    return {g,soil,sp,glow,bar,bc,bt,emoji:null,q:-1};
  }
  function drawBar(o,pct){
    const x=o.bc.getContext('2d');
    x.clearRect(0,0,64,12);
    x.fillStyle='rgba(20,15,8,.7)';x.fillRect(0,0,64,12);
    x.fillStyle='#9be27d';x.fillRect(2,2,60*pct,8);
    o.bt.needsUpdate=true;
  }
  function syncPlots(t){
    if(plots.length!==S.plots.length){
      plots.forEach(o=>scene.remove(o.g));
      plots=S.plots.map((_,i)=>makePlot(i));
      pickables=plots.map(o=>o.soil);
    }
    S.plots.forEach((p,i)=>{
      const o=plots[i];
      if(!p.c){o.sp.visible=o.glow.visible=o.bar.visible=false;o.soil.material=shared.soil;return}
      const c=CROP[p.c],pct=p.t/c.time,rd=pct>=1;
      const e=rd||pct>.66?c.e:pct>.33?'🌿':'🌱';
      const s=rd?1.5:pct>.66?1.15:pct>.33?.95:.7;
      if(o.emoji!==e){o.sp.material.map=emojiTex(e);o.sp.material.needsUpdate=true;o.emoji=e}
      o.sp.visible=true;
      o.sp.scale.set(s,s,s);
      o.sp.position.y=.25+s*.45+(rd?Math.abs(Math.sin(t*3+i))*.15:0);
      o.sp.material.color.setHex(p.g?0xffe9a0:0xffffff);
      o.soil.material=rd?shared.ready:shared.soil;
      o.glow.visible=!!p.g;
      if(p.g)o.glow.position.set(Math.cos(t*2+i)*.55,1.5+Math.sin(t*3)*.1,Math.sin(t*2+i)*.55);
      o.bar.visible=!rd;
      if(!rd){const q=Math.round(pct*60);if(q!==o.q){o.q=q;drawBar(o,pct)}}
    });
  }
  function syncAnimals(t,dt){
    const sig=ANIMALS.map(a=>Math.min(3,(S.an[a.id]&&S.an[a.id].n)||0)).join(',');
    if(sig!==animalSig){
      animals.forEach(a=>scene.remove(a.s));animals=[];
      ANIMALS.forEach(a=>{
        const n=Math.min(3,(S.an[a.id]&&S.an[a.id].n)||0);
        for(let k=0;k<n;k++){
          const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(a.e),alphaTest:.2}));
          s.scale.set(1.2,1.2,1.2);scene.add(s);
          const x=rnd(-16.3,-9.7),z=rnd(.7,4.3);
          animals.push({s,x,z,tx:x,tz:z,wait:rnd(0,3)});
        }
      });
      animalSig=sig;
    }
    animals.forEach((a,i)=>{
      if(a.wait>0)a.wait-=dt;
      else{
        const dx=a.tx-a.x,dz=a.tz-a.z,d=Math.hypot(dx,dz);
        if(d<.1){a.tx=rnd(-16.3,-9.7);a.tz=rnd(.7,4.3);a.wait=rnd(1,4)}
        else{a.x+=dx/d*dt*1.1;a.z+=dz/d*dt*1.1}
      }
      a.s.position.set(a.x,.62+(a.wait>0?0:Math.abs(Math.sin(t*7+i))*.14),a.z);
    });
  }
  function nearest(){
    let best=-1,bd=1.9;
    S.plots.forEach((_,i)=>{const [x,z]=plotXZ(i);const d=Math.hypot(x-pos.x,z-pos.z);if(d<bd){bd=d;best=i}});
    return best;
  }
  function act(i){
    if(i<0||!S.plots[i])return;
    const now=performance.now();
    if(now-lastAct<140)return;
    lastAct=now;
    const [x,z]=plotXZ(i);
    farmer.g.rotation.y=Math.atan2(x-pos.x,z-pos.z);
    const v=new THREE.Vector3(x,1.4,z).project(cam);
    const r=R.domElement.getBoundingClientRect();
    ACT.plot(String(i),{clientX:r.left+(v.x+1)/2*r.width,clientY:r.top+(1-v.y)/2*r.height});
    checkAch();render();
    swing=.3;
  }

  function init(){
    inited=true;
    el=document.getElementById('world');stage=el.querySelector('.stage');promptEl=el.querySelector('.w-prompt');
    R=new THREE.WebGLRenderer({antialias:true});
    R.setPixelRatio(Math.min(devicePixelRatio,2));
    R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
    stage.appendChild(R.domElement);
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x9fd3ea);
    scene.fog=new THREE.Fog(0x9fd3ea,32,75);
    cam=new THREE.PerspectiveCamera(55,1,.1,200);
    hemi=new THREE.HemisphereLight(0xe6f6ff,0x56743a,.85);scene.add(hemi);
    sun=new THREE.DirectionalLight(0xfff0d0,.9);sun.position.set(14,22,10);sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:80});
    scene.add(sun);
    groundMat=mat(0x7fb24a);
    ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    buildScenery();
    ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.5,40),new THREE.MeshBasicMaterial({color:0xffd75e,transparent:true,opacity:.9}));
    ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;scene.add(ring);
    farmer=makePerson(0xd9534f,0x3a6ea5,0xe8c66a);scene.add(farmer.g);
    hand=makePerson(0x5f9e4f,0x6b4a2e,0xb0884a);hand.g.scale.set(.92,.92,.92);scene.add(hand.g);
    const n=900,arr=new Float32Array(n*3);
    for(let k=0;k<n;k++){arr[k*3]=rnd(-22,22);arr[k*3+1]=rnd(0,18);arr[k*3+2]=rnd(-22,22)}
    const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.BufferAttribute(arr,3));
    weatherPts=new THREE.Points(wg,new THREE.PointsMaterial({color:0xaecdea,size:.09,transparent:true,opacity:.8}));
    weatherPts.visible=false;scene.add(weatherPts);
    ray=new THREE.Raycaster();
    bindInput();
    requestAnimationFrame(frame);
  }

  function bindInput(){
    const cv=R.domElement;
    let down=null;
    cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,drag:false};cv.setPointerCapture(e.pointerId)});
    cv.addEventListener('pointermove',e=>{
      if(!down)return;
      const dx=e.clientX-down.x;
      if(Math.abs(dx)>5||Math.abs(e.clientY-down.y)>5)down.drag=true;
      if(down.drag){yaw-=dx*.008;down.x=e.clientX;down.y=e.clientY}
    });
    cv.addEventListener('pointerup',e=>{
      if(down&&!down.drag){
        const r=cv.getBoundingClientRect();
        ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);
        const hit=ray.intersectObjects(pickables)[0];
        if(hit){const i=hit.object.userData.plot;const [x,z]=plotXZ(i);target={i,x,z:z+1.25};if(nearest()===i){act(i);target=null}}
        else{const g=ray.intersectObject(ground)[0];if(g)target={i:-1,x:g.point.x,z:g.point.z}}
      }
      down=null;
    });
    const joyEl=el.querySelector('.joy'),knob=joyEl.querySelector('i');
    const moveJoy=e=>{
      const r=joyEl.getBoundingClientRect();
      let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
      const d=Math.hypot(x,y),m=r.width/2-12;
      if(d>m){x=x/d*m;y=y/d*m}
      joy.x=x/m;joy.y=-y/m;
      knob.style.transform=`translate(${x}px,${y}px)`;
    };
    joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
    joyEl.addEventListener('pointermove',e=>{if(joyEl.hasPointerCapture(e.pointerId))moveJoy(e)});
    const endJoy=()=>{joy.x=joy.y=0;knob.style.transform=''};
    joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
    el.querySelector('.w-act').addEventListener('pointerdown',e=>{e.preventDefault();act(nearest())});
    const GAME_KEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyQ','KeyE','Space','KeyF'];
    addEventListener('keydown',e=>{
      if(!shown||!GAME_KEYS.includes(e.code)||e.ctrlKey||e.metaKey||e.altKey)return;
      e.preventDefault();
      keys[e.code]=true;
      if(e.code==='Space'||e.code==='KeyF'){if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();act(nearest())}
    });
    addEventListener('keyup',e=>{if(GAME_KEYS.includes(e.code)){keys[e.code]=false;if(shown)e.preventDefault()}});
    addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
  }

  function sky(dt){
    const tday=(S.clock%DAY)/DAY;
    const b=.5+.5*Math.cos((tday-.5)*Math.PI*2);
    const lum=.45+.55*b;
    const wx=S.weather;
    const day=new THREE.Color(wx==='storm'?0x7f909c:wx==='rain'?0xa3b6c2:wx==='snow'?0xcbd7e0:wx==='rainbow'?0xb6e0f0:0x9fd3ea);
    const col=new THREE.Color(0x1a2340).lerp(day,lum);
    scene.background.copy(col);scene.fog.color.copy(col);
    sun.intensity=.2+.8*lum*(wx==='storm'?.6:wx==='rain'?.8:1);
    hemi.intensity=.35+.55*lum;
    const gc=new THREE.Color([0x86c25a,0x7fb24a,0xa9a34c,0xdfe7ea][season()]);
    groundMat.color.lerp(gc,Math.min(1,dt*.8));
    const falling=wx==='rain'||wx==='storm'||wx==='snow';
    weatherPts.visible=falling;
    if(falling){
      const snow=wx==='snow';
      weatherPts.material.size=snow?.2:.09;
      weatherPts.material.color.setHex(snow?0xffffff:0xaecdea);
      const a=weatherPts.geometry.attributes.position.array;
      const sp=snow?2:(wx==='storm'?24:16);
      for(let k=0;k<a.length;k+=3){
        a[k+1]-=sp*dt;
        if(snow)a[k]+=Math.sin(a[k+1]+k)*dt*.4;
        if(a[k+1]<0)a[k+1]+=18;
      }
      weatherPts.geometry.attributes.position.needsUpdate=true;
      weatherPts.position.set(pos.x,0,pos.z);
    }
  }

  function update(dt,t){
    let fx=0,rx=0;
    if(keys.KeyW||keys.ArrowUp)fx+=1;
    if(keys.KeyS||keys.ArrowDown)fx-=1;
    if(keys.KeyA||keys.ArrowLeft)rx-=1;
    if(keys.KeyD||keys.ArrowRight)rx+=1;
    if(keys.KeyQ)yaw+=1.8*dt;
    if(keys.KeyE)yaw-=1.8*dt;
    fx+=joy.y;rx+=joy.x;
    let mv=Math.hypot(fx,rx),moving=false;
    if(mv>.08){
      target=null;
      if(mv>1){fx/=mv;rx/=mv;mv=1}
      const dx=-Math.sin(yaw)*fx+Math.cos(yaw)*rx,dz=-Math.cos(yaw)*fx-Math.sin(yaw)*rx;
      stepToward(pos,farmer.g,pos.x+dx,pos.z+dz,5.5*mv,dt);
      moving=true;
    }else if(target){
      const done=stepToward(pos,farmer.g,target.x,target.z,5.5,dt);
      moving=!done;
      if(done){const i=target.i;target=null;if(i>=0)act(i)}
    }
    pos.x=Math.max(-30,Math.min(30,pos.x));pos.z=Math.max(-30,Math.min(22,pos.z));
    farmer.g.position.set(pos.x,0,pos.z);
    swing=Math.max(0,swing-dt);
    animPerson(farmer,moving,dt,swing);
    // farmhand helper
    if(U('hand')&&!S.handOff){
      hand.g.visible=true;
      let best=null,bd=1e9;
      S.plots.forEach((p,i)=>{if(p.c&&p.t>=CROP[p.c].time){const [x,z]=plotXZ(i);const d=Math.hypot(x-hp.x,z+1.2-hp.z);if(d<bd){bd=d;best=[x,z+1.2]}}});
      if(!best){if(!handIdle||Math.hypot(handIdle[0]-hp.x,handIdle[1]-hp.z)<.2)handIdle=[rnd(-8,8),rnd(-15,1)];best=handIdle}
      const arrived=stepToward(hp,hand.g,best[0],best[1],3.4,dt);
      hand.g.position.set(hp.x,0,hp.z);
      animPerson(hand,!arrived,dt,0);
    }else hand.g.visible=false;
    syncPlots(t);
    syncAnimals(t,dt);
    const ni=nearest();
    ring.visible=ni>=0;
    if(ni>=0){const [x,z]=plotXZ(ni);ring.position.x=x;ring.position.z=z}
    let txt='';
    const key=coarse()?'Act':'Space';
    if(ni>=0){
      const p=S.plots[ni];
      if(!p.c){const c=CROP[S.sel];txt=`${key}: plant ${c.e} ${c.n} · 🪙${fmt(c.cost)}`}
      else{const c=CROP[p.c];txt=p.t>=c.time?`${key}: harvest ${c.e} ${c.n}${p.g?' ★':''}`:`${key}: water ${c.e} ${c.n} · ${fmtT((c.time-p.t)/growMult(c))}`}
    }
    if(txt!==promptTxt){promptEl.textContent=txt;promptTxt=txt}
    sky(dt);
    const cx=pos.x+Math.sin(yaw)*8,cz=pos.z+Math.cos(yaw)*8;
    const k=1-Math.exp(-dt*6);
    cam.position.x+=(cx-cam.position.x)*k;cam.position.y+=(4.8-cam.position.y)*k;cam.position.z+=(cz-cam.position.z)*k;
    cam.lookAt(pos.x,1.3,pos.z);
    sun.position.set(pos.x+14,22,pos.z+10);sun.target.position.set(pos.x,0,pos.z);sun.target.updateMatrixWorld();
  }

  let lastW=0,lastH=0;
  function frame(now){
    requestAnimationFrame(frame);
    if(!shown){lastT=now;return}
    const dt=Math.min(.12,Math.max(0,(now-lastT)/1000));lastT=now;
    const w=stage.clientWidth,h=stage.clientHeight;
    if(w&&h&&(w!==lastW||h!==lastH)){R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();lastW=w;lastH=h}
    update(dt,now/1000);
    R.render(scene,cam);
  }
  return {
    show(v){
      if(v&&!inited){if(!window.THREE)return false;init();cam.position.set(pos.x,4.8,pos.z+8)}
      shown=v;return true;
    },
  };
})();
</script>
<script>
'use strict';
const KEY='turnipHollow.v1';
const DAY=120;
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000)return (n<10&&n%1)?(Math.floor(n*10)/10).toString():Math.floor(n).toString();
  const e=Math.min(Math.floor(Math.log10(n)/3),SUF.length-1);
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+SUF[e];
}
function fmtT(s){
  s=Math.max(0,s);
  if(s<10)return s.toFixed(1)+'s';
  if(s<60)return Math.ceil(s)+'s';
  if(s<3600)return Math.floor(s/60)+'m '+String(Math.floor(s%60)).padStart(2,'0')+'s';
  return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

let S;
const UI={tab:'fields',confirm:null,bee:null};
const U=id=>S.up[id]||0, SK=id=>S.sk[id]||0, P=id=>S.pup[id]||0;
function basePlots(){return 4+2*P('heir')}
function startRun(){
  Object.assign(S,freshRun());
  for(let i=0;i<basePlots();i++)S.plots.push({c:null,t:0,g:false});
  if(P('start'))S.coins=500*Math.pow(10,P('start')-1);
  if(P('tools')){S.up.spreader=1;S.up.hand=3}
  S.level=1+5*P('prodigy');S.sp=S.level-1;
  S.st=[{r:null,t:0,on:false,rep:true}];
}

/* ---------- Formulas ---------- */
const season=()=>Math.floor(S.clock/DAY/3)%4;
const dayNo=()=>Math.floor(S.clock/DAY)+1;
const boostOn=k=>(S.boosts[k]||0)>S.clock;
const achCount=()=>Object.keys(S.ach).length;
const animalCount=()=>ANIMALS.reduce((s,a)=>s+((S.an[a.id]&&S.an[a.id].n)||0),0);
const inSeason=c=>c.season===season();
function seasonGrow(c){
  if(inSeason(c))return 1.2;
  if(U('greenhouse'))return 1.1;
  return (season()===3)?.8:1;
}
function seasonYield(c){return inSeason(c)?1.5:(U('greenhouse')?1.25:1)}
function weatherGrow(){
  const g=WEATHER[S.weather].g;
  return (g<1&&U('sprinkler')>0)?1:g;
}
function growMult(c){
  let m=(1+.12*U('water'))*(1+.05*SK('green'))*(1+.15*P('soil'))*(1+.05*U('sprinkler'));
  m*=weatherGrow()*seasonGrow(c);
  if(boostOn('grow'))m*=2;
  return m;
}
function yieldMult(c){return (1+.15*U('compost'))*(1+.05*SK('bounty'))*seasonYield(c)}
function baseSellMult(){return (1+.1*U('stall'))*(1+.04*SK('haggle'))*(1+.1*S.seedsTotal)*(1+.02*achCount())}
function sellMult(){return baseSellMult()*(boostOn('coins')?2:1)}
function priceOf(id){return ITEMS[id].price*(S.mkt[id]||1)*(S.hot===id?2:1)*sellMult()}
function goldenChance(){
  let g=.005+.004*U('clover')+.003*SK('lucky')+.005*P('touch');
  if(WEATHER[S.weather].gold)g*=WEATHER[S.weather].gold;
  return Math.min(g,.5);
}
const critChance=()=>.03*U('sickle');
const handRate=()=>S.handOff?0:.4*U('hand');
const animalSpeed=()=>(1+.1*U('hay'))*(1+.08*SK('whisper'));
const kitchenSpeed=()=>(1+.1*U('oven'))*(1+.08*SK('chef'));
const xpMult=()=>(1+.25*P('almanac'))*(1+.05*S.seedsTotal);
const xpReq=l=>Math.floor(12*Math.pow(l,2.35));
const maxOrders=()=>3+U('board');
const upCost=(u,l)=>u.base*Math.pow(u.g,l);
const animalCost=(a,n)=>a.cost*Math.pow(1.15,n);
const seedGain=()=>Math.floor(Math.sqrt(S.runEarned/1e6));
const unlocked=id=>ITEMS[id].lv<=S.level;
function reserved(id){
  let r=0;
  for(const a of ANIMALS){const st=S.an[a.id];if(st&&st.n&&a.feed[id])r+=st.n*a.feed[id]*2}
  for(const s of S.st){if(s.r&&RECIPE[s.r].in[id])r+=RECIPE[s.r].in[id]*2}
  for(const o of S.orders){if(o.id===id)r+=o.q}
  return r;
}
const keepAmt=id=>S.keep+reserved(id);
function replantChoice(){const r=S.replantSeed;return (r&&CROP[r]&&CROP[r].lv<=S.level)?r:'same'}

/* ---------- Actions on the economy ---------- */
function earn(v){S.coins+=v;S.stats.earned+=v;S.runEarned+=v;S.rateAcc+=v}
function gainXp(x){S.xp+=x*xpMult()}
function sell(id,q){
  q=Math.min(q,S.inv[id]||0);
  if(q<=0)return 0;
  const v=q*priceOf(id);
  S.inv[id]-=q;earn(v);
  return v;
}
function addItem(id,q){
  S.inv[id]=(S.inv[id]||0)+q;
  if(S.auto[id]!==false){
    const ex=S.inv[id]-keepAmt(id);
    if(ex>0)sell(id,ex);
  }
}
function plant(i,id){
  const c=CROP[id],p=S.plots[i];
  if(!c||p.c||S.coins<c.cost||c.lv>S.level)return false;
  S.coins-=c.cost;
  p.c=id;p.t=0;p.g=Math.random()<goldenChance();
  return true;
}
function harvest(i,manual,ev){
  const p=S.plots[i],c=CROP[p.c];
  let q=yieldMult(c);
  const crit=Math.random()<critChance();
  if(crit)q*=3;
  if(p.g)q*=10;
  q=Math.max(1,randRound(q));
  const gold=p.g;
  addItem(c.id,q);
  gainXp(c.xp*Math.sqrt(q)*(gold?3:1));
  S.stats.harvest+=q;
  if(gold)S.stats.golden++;
  p.c=null;p.t=0;p.g=false;
  if(manual&&ev)floatText(ev,`+${fmt(q)} ${c.e}${crit?' ×3':''}`,gold||crit);
  if(gold&&manual===false&&UI.live)toast(`A golden ${c.n.toLowerCase()} gave ${fmt(q)}!`,'gold');
  if(U('spreader')&&!S.replantOff){const rc=replantChoice();plant(i,rc==='same'?c.id:rc)}
}
function feedAndProduce(a,st){
  let can=st.n;
  for(const f in a.feed)can=Math.min(can,Math.floor((S.inv[f]||0)/a.feed[f]));
  st.hungry=can<st.n;
  if(can<=0)return;
  const skip=Math.min(.6,.03*U('trough'));
  for(const f in a.feed)S.inv[f]-=Math.ceil(can*a.feed[f]*(1-skip));
  addItem(a.out,can);
  S.stats.goods+=can;
  gainXp(ITEMS[a.out].xp*can*.5);
}
function hasIngr(r){for(const k in r.in)if((S.inv[k]||0)<r.in[k])return false;return true}
function takeIngr(r){for(const k in r.in)S.inv[k]-=r.in[k]}
function tickStation(s,dt){
  if(!s.r)return;
  const r=RECIPE[s.r];
  if(!s.on){
    if(!hasIngr(r))return;
    takeIngr(r);s.on=true;s.t=0;
  }
  s.t+=dt*kitchenSpeed();
  if(s.t>=r.time){
    s.on=false;s.t=0;
    addItem(r.id,1);
    S.stats.crafted++;
    gainXp(ITEMS[r.id].xp);
    if(!s.rep)s.r=null;
  }
}
function genOrder(){
  const pool=Object.values(ITEMS).filter(it=>it.lv<=S.level);
  const used=new Set(S.orders.map(o=>o.id));
  let opts=pool.filter(it=>!used.has(it.id));
  if(!opts.length)opts=pool;
  const recent=opts.filter(it=>it.lv>=S.level-14);
  const it=pick(recent.length&&Math.random()<.75?recent:opts);
  let q;
  if(it.kind==='crop')q=rint(8,22)+Math.floor(S.level*.5);
  else if(it.kind==='good')q=rint(3,9)+Math.floor(S.level*.1);
  else q=rint(1,4);
  const c=q*it.price*baseSellMult()*rnd(2.2,3.2)*(1+.15*U('scales'))*(1+.1*SK('charm'));
  return {id:it.id,q,c,x:Math.round(q*it.xp*3+5),g:Math.random()<.3?rint(1,2):0,w:rint(0,VILLAGERS.length-1)};
}
function rollWeather(force){
  const w=WX_W[season()];
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot,pickW='sunny';
  for(const k in w){r-=w[k];if(r<=0){pickW=k;break}}
  S.weather=force||pickW;
  S.wT=rnd(60,120);
  if(UI.live&&S.weather!=='sunny')toast(`Weather: ${WEATHER[S.weather].e} ${WEATHER[S.weather].n}`);
}
function shiftMarket(){
  for(const id in ITEMS){
    const m=S.mkt[id]||1;
    S.mktPrev[id]=m;
    let n=m*Math.exp((Math.random()-.5)*.35);
    n+= (1-n)*.15;
    S.mkt[id]=Math.min(1.6,Math.max(.6,n));
  }
  const pool=Object.values(ITEMS).filter(it=>it.lv<=S.level);
  S.hot=pick(pool).id;
  S.mktT=60;
  if(UI.live)toast(`Market: ${ITEMS[S.hot].e} ${ITEMS[S.hot].n} is in demand (×2 price)`,'gold');
}
function levelCheck(){
  while(S.xp>=xpReq(S.level)){
    S.xp-=xpReq(S.level);S.level++;S.sp++;
    if(UI.live){
      const un=Object.values(ITEMS).filter(it=>it.lv===S.level&&it.kind!=='good').map(it=>it.e+' '+it.n);
      ANIMALS.filter(a=>a.lv===S.level).forEach(a=>un.push(a.e+' '+a.n));
      toast(`Level ${S.level}! +1 skill point${un.length?'. New: '+un.join(', '):''}`,'gold');
    }
  }
}
function checkAch(){
  for(const a of ACHS){
    if(!S.ach[a.id]&&a.t()){
      S.ach[a.id]=1;S.gems+=a.g;
      if(UI.live)toast(`Achievement: ${a.n} (+${a.g} 💎, +2% coins)`,'gold');
    }
  }
}

/* ---------- Simulation ---------- */
function step(dt){
  const prevSeason=season();
  S.clock+=dt;S.stats.play+=dt;
  if(season()!==prevSeason){
    S.wT=0;
    if(UI.live)toast(`${SEASONS[season()].e} ${SEASONS[season()].n} has arrived. In-season crops grow faster and yield 50% more.`);
  }
  S.wT-=dt;if(S.wT<=0)rollWeather();
  S.mktT-=dt;if(S.mktT<=0)shiftMarket();
  for(const p of S.plots){
    if(!p.c)continue;
    const c=CROP[p.c];
    if(p.t<c.time)p.t=Math.min(c.time,p.t+dt*growMult(c));
  }
  const rate=handRate();
  if(rate>0){
    S.handCap=Math.min(S.handCap+rate*dt,Math.max(1,rate));
    while(S.handCap>=1){
      const i=S.plots.findIndex(p=>p.c&&p.t>=CROP[p.c].time);
      if(i<0)break;
      harvest(i,false);S.handCap-=1;
    }
  }
  for(const a of ANIMALS){
    const st=S.an[a.id];
    if(!st||!st.n)continue;
    st.p+=dt*animalSpeed()/a.time;
    let guard=0;
    while(st.p>=1&&guard++<50){st.p-=1;feedAndProduce(a,st)}
    if(st.p>=1)st.p=0;
  }
  for(const s of S.st)tickStation(s,dt);
  if(S.orders.length<maxOrders()){
    S.orderCd-=dt;
    if(S.orderCd<=0){S.orders.push(genOrder());S.orderCd=25}
  }
  S.rateT+=dt;
  if(S.rateT>=1){S.rate=S.rate*.85+(S.rateAcc/S.rateT)*.15;S.rateAcc=0;S.rateT=0}
  if(UI.live){
    S.beeT-=dt;
    if(S.beeT<=0){spawnBee();S.beeT=rnd(70,160)/(1+.12*SK('beefriend'))}
  }
  levelCheck();
}
function simulate(seconds){
  let left=seconds;
  while(left>0){const d=Math.min(1,left);step(d);left-=d}
}

/* ---------- Golden bee ---------- */
function spawnBee(){
  const b=document.getElementById('bee');
  if(!b.hidden)return;
  b.style.left=rnd(8,80)+'vw';b.style.top=rnd(22,75)+'vh';
  b.hidden=false;
  clearTimeout(UI.bee);
  UI.bee=setTimeout(()=>{b.hidden=true},13000);
}
function catchBee(ev){
  const b=document.getElementById('bee');
  b.hidden=true;clearTimeout(UI.bee);
  S.stats.bees++;
  const m=1+.5*P('queen');
  const r=Math.random();
  let msg;
  if(r<.35){const v=Math.max(60,S.rate*120)*m;earn(v);msg=`The golden bee dropped ${fmt(v)} coins!`}
  else if(r<.58){S.plots.forEach(p=>{if(p.c)p.t=CROP[p.c].time});msg='The golden bee pollinated every crop. All ready!'}
  else if(r<.78){S.boosts.grow=Math.max(S.boosts.grow||0,S.clock)+75*m;msg=`Buzzing growth: 2× crop speed for ${fmtT(75*m)}.`}
  else if(r<.93){S.boosts.coins=Math.max(S.boosts.coins||0,S.clock)+60*m;msg=`Sweet deals: 2× sell prices for ${fmtT(60*m)}.`}
  else{const g=Math.round(3*m);S.gems+=g;msg=`The golden bee left ${g} gems!`}
  floatText(ev,'🐝 Caught!',true);
  toast(msg,'gold');
}

/* ---------- UI helpers ---------- */
function toast(msg,kind){
  const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:'');t.textContent=msg;
  const box=document.getElementById('toasts');
  box.appendChild(t);
  while(box.children.length>5)box.firstChild.remove();
  setTimeout(()=>t.remove(),4200);
}
function floatText(ev,txt,gold){
  const f=document.createElement('div');
  f.className='float'+(gold?' g':'');f.textContent=txt;
  f.style.left=(ev.clientX||innerWidth/2)+'px';f.style.top=((ev.clientY||innerHeight/2)-20)+'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1000);
}
function morph(target,html){
  const tmp=document.createElement(target.tagName);
  tmp.innerHTML=html;
  patchChildren(target,tmp);
}
function patchChildren(a,b){
  const an=[...a.childNodes],bn=[...b.childNodes];
  for(let i=0;i<bn.length;i++){
    if(i>=an.length)a.appendChild(bn[i]);
    else patchNode(an[i],bn[i]);
  }
  for(let i=bn.length;i<an.length;i++)an[i].remove();
}
function patchNode(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  patchChildren(a,b);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function confirmBtn(key,label,cls,again){
  const armed=UI.confirm&&UI.confirm.k===key&&UI.confirm.until>performance.now();
  return `<button class="btn ${armed?'gold':cls}" data-a="${key}">${armed?(again||'Click again to confirm'):label}</button>`;
}
function armed(key){
  if(UI.confirm&&UI.confirm.k===key&&UI.confirm.until>performance.now()){UI.confirm=null;return true}
  UI.confirm={k:key,until:performance.now()+4000};
  return false;
}

  const next=RECIPES.find(r=>r.lv>S.level);
  const recipes=RECIPES.filter(r=>r.lv<=S.level).map(r=>{
    const ing=Object.entries(r.in).map(([k,v])=>`<span class="${(S.inv[k]||0)>=v?'ok':'miss'}">${ITEMS[k].e} ${v} <span class="mute">(${fmt(S.inv[k]||0)})</span></span>`).join('');
    const inVal=Object.entries(r.in).reduce((s,[k,v])=>s+priceOf(k)*v,0);
    return `<div class="card section" style="gap:8px">
      <div class="row spread"><div class="row"><span class="big">${r.e}</span><div><h3>${r.n}</h3><div class="mute num" style="font-size:12px">${fmtT(r.time/kitchenSpeed())} · sells ${fmt(priceOf(r.id))}</div></div></div>
      <span class="tag green">+${Math.max(0,Math.round((priceOf(r.id)/inVal-1)*100))}%</span></div>
      <div class="ing">${ing}</div>
      <button class="btn pri" data-a="cook" data-v="${r.id}" ${idle?'':'disabled'}>${idle?'Cook':'All stations busy'}</button>
    </div>`;
  }).join('')+(next?`<div class="card lock"><div class="row"><span class="big">🔒</span><div><h3>${next.n}</h3><div class="mute">Unlocks at Lv ${next.lv}</div></div></div></div>`:'');
  return `<div class="section">
    <div><h2>The Kitchen</h2><p class="lead">Turn crops and animal goods into dishes worth far more than their ingredients. With repeat on, a station keeps cooking whenever the silo has what it needs. The tag shows profit over selling the raw ingredients.</p></div>
    <div class="grid">${stations}</div>
    <h3>Recipes</h3>
    <div class="grid">${recipes}</div>
  </div>`;
}

function renderMarket(){
  const items=Object.values(ITEMS).filter(it=>it.lv<=S.level||(S.inv[it.id]||0)>0);
  const rows=items.map(it=>{
    const m=S.mkt[it.id]||1,pv=S.mktPrev[it.id]||1;
    const tr=m>pv+.005?'<span class="up">▲</span>':m<pv-.005?'<span class="down">▼</span>':'<span class="mute">–</span>';
    const have=S.inv[it.id]||0;
    const auto=S.auto[it.id]!==false;
    return `<tr class="${S.hot===it.id?'hot':''}">
      <td>${it.e} <b>${it.n}</b>${S.hot===it.id?' <span class="tag">×2 demand</span>':''}</td>
      <td>${fmt(have)}</td>
      <td>🪙${fmt(priceOf(it.id))}</td>
      <td>${tr} ${Math.round(m*100)}%</td>
      <td>${fmt(keepAmt(it.id))}</td>
      <td><button class="btn sm ${auto?'on':''}" data-a="auto" data-v="${it.id}">${auto?'Auto-sell on':'Auto-sell off'}</button></td>
      <td><button class="btn sm" data-a="sell" data-v="${it.id}" ${have>=1?'':'disabled'}>Sell all</button></td>
    </tr>`;
  }).join('');
  const keeps=[0,25,100,500,2500].map(k=>`<button class="btn sm ${S.keep===k?'on':''}" data-a="keep" data-v="${k}">${fmt(k)}</button>`).join('');
  const total=items.reduce((s,it)=>s+Math.floor(S.inv[it.id]||0)*priceOf(it.id),0);
  return `<div class="section">
    <div class="row spread">
      <div><h2>Market &amp; Silo</h2><p class="lead">Prices drift every minute between 60% and 160% of normal, and one item is always in high demand at double price. Auto-sell sells anything above the amount you keep. The silo also holds back feed, recipe ingredients and order items for you.</p></div>
      <button class="btn gold" data-a="sellAll" ${total>0?'':'disabled'}>Sell whole silo · 🪙${fmt(total)}</button>
    </div>
    <div class="row"><span class="eyebrow">Keep at least</span>${keeps}<span class="mute num">Next price shift in ${fmtT(S.mktT)}</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Item</th><th>In silo</th><th>Price</th><th>Market</th><th>Kept</th><th>Auto</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderOrders(){
  const cards=S.orders.map((o,i)=>{
    const it=ITEMS[o.id],have=S.inv[o.id]||0,[name,face]=VILLAGERS[o.w];
    const ok=have>=o.q;
    return `<div class="card order">
      <div class="who"><span class="face">${face}</span><div><h3>${name}</h3><div class="mute" style="font-size:12px">would like</div></div></div>
      <div class="want"><span class="e">${it.e}</span><div><b class="num">${fmt(o.q)} × ${it.n}</b><div class="num ${ok?'up':'mute'}" style="font-size:12px">You have ${fmt(have)}</div></div></div>
      <div class="bar2"><i style="width:${Math.min(100,have/o.q*100).toFixed(1)}%"></i></div>
      <div class="row" style="font-weight:800">🪙 ${fmt(o.c)} <span class="mute">·</span> ${fmt(o.x)} XP ${o.g?`<span class="mute">·</span> 💎 ${o.g}`:''}</div>
      <div class="row"><button class="btn pri" data-a="deliver" data-v="${i}" ${ok?'':'disabled'}>Deliver</button><button class="btn sm" data-a="decline" data-v="${i}">Decline</button></div>
    </div>`;
  }).join('');
  const waiting=S.orders.length<maxOrders()?`<div class="card"><div class="row"><span class="big mute">✉️</span><span class="mute num">A villager arrives in ${fmtT(S.orderCd)}</span></div></div>`:'';
  return `<div class="section">
    <div><h2>Villager Orders</h2><p class="lead">Villagers pay well above market price, and sometimes in gems. Items an order needs are held back from auto-sell, so orders usually fill themselves.</p></div>
    <div class="grid">${cards}${waiting}</div>
  </div>`;
}

function renderUpgrades(){
  const visible=UPGRADES.filter(u=>u.lv<=S.level);
  const cards=visible.map(u=>{
    const l=U(u.id),mx=u.max(),maxed=l>=mx,cost=upCost(u,l);
    return `<div class="card section" style="gap:8px">
      <div class="row spread"><div class="row"><span class="big">${u.e}</span><div><h3>${u.n}</h3><div class="mute num" style="font-size:12px">Level ${l}${mx>1?' / '+mx:''}</div></div></div>${u.fx?`<span class="tag green">${u.fx(l)}</span>`:''}</div>
      <p class="mute" style="margin:0;font-size:13px">${u.d}</p>
      <button class="btn pri" data-a="buyUp" data-v="${u.id}" ${!maxed&&S.coins>=cost?'':'disabled'}>${maxed?'Maxed':`Upgrade · 🪙${fmt(cost)}`}</button>
    </div>`;
  }).join('');
  const lockedN=UPGRADES.length-visible.length;
  const boosts=BOOSTS.map(b=>`<div class="card section" style="gap:8px">
      <div class="row"><span class="big">${b.e}</span><div><h3>${b.n}</h3><div class="mute" style="font-size:12.5px">${b.d}</div></div></div>
      <button class="btn gold" data-a="boost" data-v="${b.id}" ${S.gems>=b.gems?'':'disabled'}>Use · 💎${b.gems}</button>
    </div>`).join('');
  return `<div class="section">
    <div><h2>Upgrades</h2><p class="lead">Spend coins on tools, buildings and helpers.${lockedN?` ${lockedN} more unlock as you level up.`:''}</p></div>
    <div class="grid">${cards}</div>
    <div><h2>Gem Boosts</h2><p class="lead">Gems come from achievements, villager orders and golden bees.</p></div>
    <div class="grid">${boosts}</div>
  </div>`;
}

function renderSkills(){
  const spent=Object.values(S.sk).reduce((a,b)=>a+b,0);
  const cards=SKILLS.map(s=>{
    const l=SK(s.id),maxed=l>=s.max;
    return `<div class="card section skill" style="gap:8px">
      <div class="row spread"><div class="row"><span class="big">${s.e}</span><div><h3>${s.n}</h3><div class="mute" style="font-size:12.5px">${s.d}</div></div></div></div>
      <div class="pips">${Array.from({length:s.max},(_,i)=>`<i class="${i<l?'f':''}"></i>`).join('')}</div>
      <button class="btn pri" data-a="skill" data-v="${s.id}" ${!maxed&&S.sp>0?'':'disabled'}>${maxed?'Mastered':'Learn · 1 point'}</button>
    </div>`;
  }).join('');
  return `<div class="section">
    <div class="row spread">
      <div><h2>Farmer Skills</h2><p class="lead">You earn one skill point every level. Points reset at each festival, along with your level.</p></div>
      <div class="row"><span class="chip">${S.sp} point${S.sp===1?'':'s'} available</span><button class="btn sm" data-a="respec" ${spent&&S.gems>=3?'':'disabled'}>Reset skills · 💎3</button></div>
    </div>
    <div class="grid">${cards}</div>
  </div>`;
}

function renderFestival(){
  const g=seedGain();
  const nextAt=Math.pow(g+1,2)*1e6;
  const shop=PUPS.map(p=>{
    const l=P(p.id),maxed=l>=p.max,c=p.c(l);
    return `<div class="card section" style="gap:8px">
      <div class="row spread"><div class="row"><span class="big">${p.e}</span><div><h3>${p.n}</h3><div class="mute num" style="font-size:12px">Level ${l} / ${p.max}</div></div></div></div>
      <p class="mute" style="margin:0;font-size:13px">${p.d}</p>
      <button class="btn gold" data-a="pbuy" data-v="${p.id}" ${!maxed&&S.seeds>=c?'':'disabled'}>${maxed?'Maxed':`Buy · ${c} golden seed${c>1?'s':''}`}</button>
    </div>`;
  }).join('');
  return `<div class="section">
    <div class="card festival-hero section">
      <div class="eyebrow">The Harvest Moon Festival</div>
      <h2>Celebrate, then start a new farm stronger</h2>
      <p class="lead">Holding the festival resets your coins, level, skills, plots, upgrades, animals, kitchen and silo. You keep gems, achievements, festival upgrades and every golden seed. Each golden seed you have ever earned permanently adds +10% to all prices and +5% to XP.</p>
      <div class="row" style="gap:28px">
        <div><div class="eyebrow">Earned this farm</div><div class="bignum">🪙 ${fmt(S.runEarned)}</div></div>
        <div><div class="eyebrow">Golden seeds on offer</div><div class="bignum"><span class="gseed"></span> ${fmt(g)}</div><div class="mute num" style="font-size:12px">Next seed at ${fmt(nextAt)} earned</div></div>
        <div><div class="eyebrow">Seeds ever earned</div><div class="bignum">${fmt(S.seedsTotal)}</div><div class="mute num" style="font-size:12px">+${fmt(10*S.seedsTotal)}% prices now</div></div>
      </div>
      <div class="row">${g>=1?confirmBtn('festival',`Hold the festival · +${fmt(g)} golden seeds`,'gold','Click again to reset this farm'):'<button class="btn" disabled>Earn 1M coins on this farm to hold a festival</button>'}</div>
    </div>
    <div><h2>Festival Shop</h2><p class="lead">Spend golden seeds on permanent upgrades. Spending seeds does not lower the +10% bonus.</p></div>
    <div class="grid">${shop}</div>
  </div>`;
}

function renderAlmanac(){
  const s=S.stats;
  const stats=[
    ['Crops harvested',fmt(s.harvest)],['Golden crops',fmt(s.golden)],['Coins earned, all time',fmt(s.earned)],['Coins earned, this farm',fmt(S.runEarned)],
    ['Animal goods',fmt(s.goods)],['Dishes cooked',fmt(s.crafted)],['Orders delivered',fmt(s.orders)],['Golden bees caught',fmt(s.bees)],
    ['Festivals held',fmt(s.festivals)],['Time farmed',fmtT(s.play)],['Clicks',fmt(s.clicks)],['Achievement bonus',`+${achCount()*2}% coins`],
  ].map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('');
  const achs=ACHS.map(a=>`<div class="ach${S.ach[a.id]?' got':''}"><span class="medal">🏅</span><div><b>${a.n}</b><div class="mute" style="font-size:12px">${a.d} · ${a.g} 💎</div></div></div>`).join('');
  return `<div class="section">
    <div class="row spread"><h2>Farmer's Almanac</h2><span class="chip">${achCount()} / ${ACHS.length} achievements</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      <div class="card section" style="gap:6px"><h3>Records</h3>${stats}</div>
      <div class="card section" style="gap:8px"><h3>Farm icon</h3>
        <p class="mute" style="margin:0;font-size:13px">Pick the icon shown beside the farm name and on the browser tab.</p>
        <div class="iconpick">${ICONS.map(([e,n])=>`<button class="${(S.icon||'🌱')===e?'on':''}" data-a="icon" data-v="${e}" title="${n}" aria-label="${n}">${e}</button>`).join('')}</div>
      </div>
      <div class="card section" style="gap:8px"><h3>How the farm works</h3>
        <p class="mute" style="margin:0;font-size:13px">A day lasts 2 minutes and each season lasts 3 days. In-season crops grow 20% faster and yield 50% more; winter slows everything else down. Weather shifts every minute or two. Golden crops yield ten times as much. The farm keeps running while you are away, for up to 12 hours.</p>
        <p class="mute" style="margin:0;font-size:13px">Progress saves in this browser every few seconds.</p>
        <div>${confirmBtn('reset','Erase save and start over','warn','Click again to erase everything')}</div>
      </div>
    </div>
    <h3>Achievements</h3>
    <div class="grid">${achs}</div>
  </div>`;
}

const PANELS={fields:renderFields,barn:renderBarn,kitchen:renderKitchen,market:renderMarket,orders:renderOrders,upgrades:renderUpgrades,skills:renderSkills,festival:renderFestival,almanac:renderAlmanac};
let lastTab=null;
function render(){
  morph(document.getElementById('hud'),renderHud());
  const panel=document.getElementById('panel');
  if(lastTab!==UI.tab){panel.innerHTML='';lastTab=UI.tab}
  morph(panel,PANELS[UI.tab]());
  const want=UI.tab==='fields'&&S.view==='3d'&&!!window.THREE;
  const w=document.getElementById('world');
  if(w.hidden===want){w.hidden=!want;World.show(want)}
}

/* ---------- Input ---------- */
const ACT={
  tab:v=>{UI.tab=v;UI.confirm=null},
  seed:v=>{S.sel=v},
  plot:(v,e)=>{
    const i=+v,p=S.plots[i];
    if(!p)return;
    if(!p.c){if(!plant(i,S.sel))floatText(e,'Need 🪙'+fmt(CROP[S.sel].cost));return}
    const c=CROP[p.c];
    if(p.t>=c.time)harvest(i,true,e);
    else{p.t=Math.min(c.time,p.t+c.time*.06+.15);floatText(e,'💧')}
  },
  harvestAll:(v,e)=>{
    let n=0;
    S.plots.forEach((p,i)=>{if(p.c&&p.t>=CROP[p.c].time){harvest(i,true);n++}});
    if(n)floatText(e,`Harvested ${n} plots`);
  },
  plantAll:()=>{S.plots.forEach((p,i)=>{if(!p.c)plant(i,S.sel)})},
  buyUp:v=>{
    const u=UPG[v],l=U(v),c=upCost(u,l);
    if(l>=u.max()||S.coins<c)return;
    S.coins-=c;S.up[v]=l+1;
    if(v==='plot')S.plots.push({c:null,t:0,g:false});
    if(v==='station')S.st.push({r:null,t:0,on:false,rep:true});
  },
  buyAnimal:v=>{
    const a=ANIMALS.find(x=>x.id===v);
    const st=S.an[v]||(S.an[v]={n:0,p:0,hungry:false});
    const c=animalCost(a,st.n);
    if(S.coins<c)return;
    S.coins-=c;st.n++;
  },
  cook:v=>{const s=S.st.find(s=>!s.r);if(s){s.r=v;s.on=false;s.t=0;s.rep=true}},
  stRep:v=>{const s=S.st[+v];if(s)s.rep=!s.rep},
  stStop:v=>{
    const s=S.st[+v];if(!s||!s.r)return;
    if(s.on){const r=RECIPE[s.r];for(const k in r.in)S.inv[k]=(S.inv[k]||0)+r.in[k]}
    s.r=null;s.on=false;s.t=0;
  },
  keep:v=>{S.keep=+v},
  view:()=>{S.view=S.view==='3d'?'grid':'3d'},
  icon:v=>{S.icon=v;setFavicon()},
  replantSeed:v=>{S.replantSeed=v},
  toggleReplant:()=>{S.replantOff=!S.replantOff;toast(S.replantOff?'Auto-replant paused. Harvested plots stay empty for you to plant.':'Auto-replant is back on.')},
  toggleHand:()=>{S.handOff=!S.handOff;toast(S.handOff?'Farmhand paused. Ripe crops will wait for you.':'Farmhand is back to harvesting.')},
  auto:v=>{S.auto[v]=S.auto[v]===false},
  sell:(v,e)=>{const g=sell(v,Math.floor(S.inv[v]||0));if(g)floatText(e,'+🪙'+fmt(g),true)},
  sellAll:(v,e)=>{let g=0;for(const id in S.inv)g+=sell(id,Math.floor(S.inv[id]));if(g)floatText(e,'+🪙'+fmt(g),true)},
  deliver:(v,e)=>{
    const i=+v,o=S.orders[i];
    if(!o||(S.inv[o.id]||0)<o.q)return;
    S.inv[o.id]-=o.q;earn(o.c);gainXp(o.x);S.gems+=o.g;S.stats.orders++;
    S.orders.splice(i,1);
    S.orderCd=Math.min(S.orderCd,8);
    floatText(e,`+🪙${fmt(o.c)}${o.g?` +💎${o.g}`:''}`,true);
    toast(`${VILLAGERS[o.w][0]} thanks you!`);
  },
  decline:v=>{S.orders.splice(+v,1);S.orderCd=Math.max(S.orderCd,20)},
  skill:v=>{const s=SKILLS.find(x=>x.id===v);if(S.sp>0&&SK(v)<s.max){S.sk[v]=SK(v)+1;S.sp--}},
  respec:()=>{if(S.gems<3)return;S.gems-=3;S.sp+=Object.values(S.sk).reduce((a,b)=>a+b,0);S.sk={}},
  boost:v=>{
    const b=BOOSTS.find(x=>x.id===v);
    if(S.gems<b.gems)return;
    S.gems-=b.gems;
    if(v==='grow'||v==='coins')S.boosts[v]=Math.max(S.boosts[v]||0,S.clock)+600;
    if(v==='raindance'){S.weather='storm';S.wT=300}
    if(v==='rainbow'){S.weather='rainbow';S.wT=180}
    if(v==='miracle')S.plots.forEach(p=>{if(p.c)p.t=CROP[p.c].time});
    if(v==='skip'){
      const before=S.coins;
      UI.live=false;simulate(3600);UI.live=true;
      toast(`An hour passed in a blink: +🪙${fmt(Math.max(0,S.coins-before))}`,'gold');
    }
    toast(`${b.e} ${b.n} used`);
  },
  pbuy:v=>{const p=PUP[v],l=P(v),c=p.c(l);if(l<p.max&&S.seeds>=c){S.seeds-=c;S.pup[v]=l+1}},
  festival:()=>{
    if(!armed('festival'))return;
    const g=seedGain();if(g<1)return;
    S.seeds+=g;S.seedsTotal+=g;S.stats.festivals++;
    S.stats.bestRun=Math.max(S.stats.bestRun,S.runEarned);
    startRun();
    UI.tab='festival';
    toast(`The festival was a joy! +${g} golden seeds. A fresh farm awaits.`,'gold');
  },
  reset:()=>{
    if(!armed('reset'))return;
    try{localStorage.removeItem(KEY)}catch(e){}
    S=Object.assign(freshMeta(),freshRun());startRun();setFavicon();
    UI.tab='fields';toast('Fresh start. Welcome to Turnip Hollow!');
  },
  closeModal:()=>{document.getElementById('modal').hidden=true},
};
document.addEventListener('click',e=>{
  if(e.target.closest('#bee')){catchBee(e);render();return}
  const t=e.target.closest('[data-a]');
  if(!t)return;
  const a=t.dataset.a;
  if(UI.confirm&&UI.confirm.k!==a)UI.confirm=null;
  S.stats.clicks++;
  if(ACT[a])ACT[a](t.dataset.v,e,t);
  checkAch();
  render();
});

/* ---------- Save / load / loop ---------- */
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hydrate(d){
  const base=Object.assign(freshMeta(),freshRun());
  S=Object.assign(base,d);
  S.stats=Object.assign(freshMeta().stats,d.stats||{});
  if(!S.plots.length)startRun();
  if(!CROP[S.sel])S.sel='wheat';
}
function welcomeBack(secs,coins,xpLv){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="card section" role="dialog" aria-modal="true">
    <div class="eyebrow">While you were away</div>
    <h2>Your farm kept working for ${fmtT(secs)}</h2>
    <div class="kv"><span>Coins earned</span><span>🪙 ${fmt(coins)}</span></div>
    ${xpLv?`<div class="kv"><span>Levels gained</span><span>+${xpLv}</span></div>`:''}
    <p class="mute" style="margin:0;font-size:13px">${U('hand')&&S.handOff?'Your farmhand is paused, so nothing was harvested.':U('hand')?'Your farmhands harvested while you were gone.':'Hire a farmhand in Upgrades so crops get harvested while you are away.'}</p>
    <button class="btn pri" data-a="closeModal">Back to the farm</button>
  </div>`;
  m.hidden=false;
}
function start(data){
  let d=data&&data.S;
  let fromStorage=false;
  if(!d){try{const raw=localStorage.getItem(KEY);if(raw){d=JSON.parse(raw);fromStorage=true}}catch(e){d=null}}
  if(d)hydrate(d);
  else{S=Object.assign(freshMeta(),freshRun());startRun();shiftMarket()}
  UI.live=false;
  if(fromStorage){
    const away=Math.min(12*3600,Math.max(0,(Date.now()-(S.last||Date.now()))/1000));
    if(away>30){
      const c0=S.stats.earned,l0=S.level;
      simulate(away);
      welcomeBack(away,S.stats.earned-c0,S.level-l0);
    }
  }
  UI.live=true;
  checkAch();
  setFavicon();
  render();
  let last=performance.now(),acc=0,saveAcc=0;
  setInterval(()=>{
    const now=performance.now();
    let dt=(now-last)/1000;last=now;
    if(dt>5){UI.live=false;simulate(Math.min(dt,12*3600));UI.live=true}
    else step(dt);
    acc+=dt;saveAcc+=dt;
    if(acc>=.25){acc=0;render()}
    if(saveAcc>=5){saveAcc=0;checkAch();save()}
  },100);
  addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  addEventListener('pagehide',save);
  window.claude?.hot?.snapshot?.(()=>({S:JSON.parse(JSON.stringify(S))}));
}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);
else start(window.claude?.hot?.data??{});
</script>
